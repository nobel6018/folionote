name: 💡 기능 제안 · Feature request
description: 있으면 좋겠는 기능이나 개선을 제안합니다. Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        한국어와 영어 모두 환영합니다. Write in Korean or English.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 풀고 싶나 · What problem are you trying to solve
      description: 지금 무엇이 불편한지부터 적어 주세요. Start with what is inconvenient today. 기능보다 상황을 알면 더 나은 방법을 같이 찾을 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작 · What you want to happen
      description: 화면이나 설정값이 어떻게 달라지면 되는지 적어 주세요. Describe how the screen or the config should behave.
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 직접 PR을 만들 의향 · Willing to open a PR
      options:
        - label: 제가 구현해서 PR을 올려 보겠습니다. I'd like to implement this myself.
          required: false
